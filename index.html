<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Mapa Eleitoral CPC I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/firebase/firebase-app-compat.js"></script>
<script src="vendor/firebase/firebase-firestore-compat.js"></script>
<style>
:root{
  --page:#f2f3ee;
  --surface:#ffffff;
  --surface-2:#e9ebe2;
  --map-bg:#e8e6da;
  --ink:#12140f;
  --ink-2:#4c5045;
  --muted:#83887a;
  --line:#d7d9cb;
  --line-strong:#c1c4b3;
  --accent:#a4732f;
  --on-accent:#fffaf1;
  --focus:#2a78d6;
  --warn:#fab219;
  --warn-ink:#4a3200;
  --critical:#d03b3b;
  --on-critical:#ffffff;
  --cia-1:#2a78d6;
  --cia-2:#eb6834;
  --cia-3:#1baf7a;
  --cia-4:#eda100;
  --cia-x:#8b8f7c;
  --shadow:0 10px 28px rgba(20,18,8,0.14), 0 2px 6px rgba(20,18,8,0.10);
  --font-display:"Archivo",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0c0d09;
    --surface:#17180f;
    --surface-2:#1d1f14;
    --map-bg:#181910;
    --ink:#f1efe4;
    --ink-2:#c5c8b8;
    --muted:#8e9280;
    --line:#2b2d20;
    --line-strong:#3a3d2b;
    --accent:#d9a154;
    --on-accent:#2a1c08;
    --focus:#3987e5;
    --warn-ink:#2a1c00;
    --cia-1:#3987e5;
    --cia-2:#d95926;
    --cia-3:#199e70;
    --cia-4:#c98500;
    --cia-x:#9a9d8a;
    --shadow:0 10px 28px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"]{
  --page:#0c0d09;
  --surface:#17180f;
  --surface-2:#1d1f14;
  --map-bg:#181910;
  --ink:#f1efe4;
  --ink-2:#c5c8b8;
  --muted:#8e9280;
  --line:#2b2d20;
  --line-strong:#3a3d2b;
  --accent:#d9a154;
  --on-accent:#2a1c08;
  --focus:#3987e5;
  --warn-ink:#2a1c00;
  --cia-1:#3987e5;
  --cia-2:#d95926;
  --cia-3:#199e70;
  --cia-4:#c98500;
  --cia-x:#9a9d8a;
  --shadow:0 10px 28px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;}
button,input{font-family:inherit;}
::selection{background:var(--accent);color:var(--on-accent);}
a{color:inherit;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.tabular{font-variant-numeric:tabular-nums;}
.mono{font-family:var(--font-mono);}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh;}
.sidebar{grid-column:1;}
.mapwrap{grid-column:2;position:relative;background:var(--map-bg);overflow:hidden;min-height:100vh;}
@media (max-width:760px){
  .app{grid-template-columns:1fr;}
  .mapwrap{grid-column:1;}
}

/* ---------- sidebar ---------- */
.sidebar{
  background:var(--surface-2);
  border-right:1px solid var(--line);
  padding:22px 18px 28px;
  display:flex;flex-direction:column;gap:20px;
  max-height:100vh;overflow-y:auto;
  position:relative;z-index:6;
}
@media (max-width:760px){
  .sidebar{z-index:660;}
}
.eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);font-weight:600;
}
.hdr h1{font-size:26px;font-weight:800;line-height:1.1;margin-top:4px;}
.hdr p{margin:6px 0 0;color:var(--ink-2);font-size:13px;line-height:1.4;}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 8px;text-align:center;
}
.stat .v{font-family:var(--font-mono);font-weight:600;font-size:18px;display:block;}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;display:block;}

.filter-group{border-top:1px solid var(--line);padding-top:16px;}
.filter-group h3{
  font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
  margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-weight:600;
}
.filter-group h3 button{
  background:none;border:none;color:var(--accent);font-size:11px;cursor:pointer;font-family:var(--font-body);
  text-transform:none;letter-spacing:0;padding:2px 4px;
}
.search-input{
  width:100%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px;
}
.checklist{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;}
.check-row{
  display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px;
}
.check-row:hover{background:var(--surface);}
.check-row.filtered-out{display:none;}
.check-row input{accent-color:var(--accent);width:14px;height:14px;flex:none;}
.swatch{width:10px;height:10px;border-radius:50%;flex:none;}
.check-row .name{flex:1;color:var(--ink);}
.check-row .count{font-family:var(--font-mono);font-size:11px;color:var(--muted);}

.missing-box{
  border:1px solid var(--warn);background:color-mix(in srgb, var(--warn) 14%, var(--surface));
  border-radius:10px;padding:10px 12px;
}
.missing-box .mh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--warn-ink);margin-bottom:6px;}
.missing-row{font-size:12px;color:var(--ink-2);padding:3px 0;border-top:1px dashed color-mix(in srgb, var(--warn) 40%, transparent);}
.missing-row:first-child{border-top:none;}
.missing-row b{color:var(--ink);}

.footnote{font-size:11px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:12px;}
.footnote a{color:var(--accent);text-decoration:underline;}

/* ---------- map (leaflet) ---------- */
#map{position:absolute;inset:0;background:var(--map-bg);}
.leaflet-container{font-family:var(--font-body);background:var(--map-bg);}
.leaflet-control-zoom{display:none;}
.leaflet-control-attribution{
  background:color-mix(in srgb, var(--surface) 85%, transparent) !important;
  color:var(--muted) !important;font-size:10px !important;
}
.leaflet-control-attribution a{color:var(--ink-2) !important;}

.legend{
  position:absolute;left:16px;bottom:16px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);font-size:12px;max-width:220px;z-index:650;
  max-height:calc(100vh - 32px);overflow-y:auto;
}
.legend .lhead{
  display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;cursor:pointer;
  padding:2px 0;user-select:none;
}
.legend .lhead .chev{color:var(--muted);transition:transform .15s ease;font-size:11px;}
.legend.collapsed .lhead .chev{transform:rotate(-90deg);}
.legend .lbody{margin-top:8px;}
.legend.collapsed .lbody{display:none;}
.legend .lrow{display:flex;align-items:center;gap:8px;padding:3px 0;}
.legend .lrow .count{margin-left:auto;font-family:var(--font-mono);color:var(--muted);font-size:11px;}
.legend .lnote{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:10.5px;line-height:1.4;}
.legend .lsec{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.lthumb{width:18px;height:18px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);}
@media (max-width:760px){
  .legend{max-width:min(72vw,260px);}
}

.ricon{width:36px;height:36px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--surface), var(--shadow);background:var(--surface-2);transition:box-shadow .15s ease;}
.ricon img{width:100%;height:100%;object-fit:cover;display:block;}
.ricon.plain{display:flex;align-items:center;justify-content:center;}
.ricon.plain .dotfill{width:12px;height:12px;border-radius:50%;}
.ricon.situacao-pronto{box-shadow:0 0 0 3px #0ca30c, var(--shadow);}
.ricon.situacao-falta{box-shadow:0 0 0 3px var(--critical), var(--shadow);}

.turno-toggle{
  display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;
  position:absolute;top:58px;left:16px;z-index:650;box-shadow:var(--shadow);
}
.turno-toggle button{
  border:none;background:none;color:var(--ink-2);font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px;
  cursor:pointer;font-family:var(--font-body);
}
.turno-toggle button.active{background:var(--accent);color:var(--on-accent);}

.zoomctl{position:absolute;right:16px;bottom:38px;display:flex;flex-direction:column;gap:6px;z-index:650;}
.zoombtn{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);font-family:var(--font-mono);font-size:17px;box-shadow:var(--shadow);cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.zoombtn:hover{background:var(--surface-2);}

.topbadge{
  position:absolute;top:16px;left:16px;z-index:650;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px 6px 10px;box-shadow:var(--shadow);font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.topbadge .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}

.filtoggle{display:none;}
.backdrop{display:none;position:fixed;inset:0;background:rgba(10,10,5,.35);z-index:655;}
.backdrop.show{display:block;}
@media (max-width:760px){
  .filtoggle{
    display:flex;position:absolute;top:16px;right:16px;z-index:650;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);
    font-size:12.5px;font-weight:600;gap:6px;align-items:center;cursor:pointer;
  }
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:340px;
    transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow);
  }
  .sidebar.open{transform:translateX(0);}
}

/* ---------- detail panel ---------- */
.detail{
  position:fixed;top:0;right:0;height:100vh;width:340px;background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);
  transition:transform .25s ease;z-index:700;overflow-y:auto;padding:22px;
}
.detail.open{transform:translateX(0);}
.detail .close{
  position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;color:var(--muted);
  cursor:pointer;width:30px;height:30px;
}
.detail .eyebrow2{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;}
.detail h2{font-size:18px;margin-top:6px;line-height:1.25;padding-right:20px;}
.detail .ciachip{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);
}
.detail .ciachip .swatch{width:9px;height:9px;border-radius:50%;}
.detail dl{margin:18px 0 0;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;}
.detail dt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;padding-top:1px;}
.detail dd{margin:0;font-size:13px;color:var(--ink);line-height:1.4;}
.detail .statusbadge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;
}
.statusbadge.ok{background:color-mix(in srgb, #0ca30c 16%, var(--surface));color:#0ca30c;}
.statusbadge.warn{background:color-mix(in srgb, var(--warn) 22%, var(--surface));color:var(--warn-ink);}
.situacao-section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.situacao-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;}
.situacao-group{display:flex;gap:8px;}
.situacao-btn{
  flex:1;padding:10px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;font-family:var(--font-body);
  transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.situacao-btn:hover{background:var(--surface-2);}
.situacao-btn.falta.active{background:var(--critical);color:var(--on-critical);border-color:var(--critical);}
.situacao-btn.pronto.active{background:#0ca30c;color:#fff;border-color:#0ca30c;}
.situacao-meta{margin-top:8px;font-size:11px;color:var(--muted);min-height:14px;}
.guarnicao-input{
  width:100%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;margin-bottom:8px;
}
.situacao-save{
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:8px;
  padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font-body);
}
.situacao-save:hover{background:var(--surface);}
@media (max-width:760px){
  .detail{top:auto;bottom:0;left:0;right:0;width:auto;height:auto;max-height:72vh;
    border-left:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%);}
  .detail.open{transform:translateY(0);}
}

/* ---------- chooser ---------- */
.chooser{max-width:760px;margin:0 auto;padding:64px 20px 60px;}
.chooser .hdr{margin-bottom:8px;}
.chooser h1{font-size:32px;margin-top:6px;}
.chooser > p{color:var(--ink-2);font-size:14.5px;line-height:1.6;max-width:56ch;margin:14px 0 34px;}
.bpm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.bpm-card{
  display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;
  text-decoration:none;color:var(--ink);transition:transform .15s ease, box-shadow .15s ease;
}
.bpm-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-strong);}
.bpm-card .num{font-family:var(--font-display);font-size:34px;font-weight:800;color:var(--accent);}
.bpm-card .name{font-size:14px;font-weight:600;margin-top:2px;}
.bpm-card .meta{margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:12px;font-family:var(--font-mono);}
.chooser .src{margin-top:40px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.001ms !important;animation-duration:.001ms !important;}
}
</style>
</head>

function timeAgo(date){
  const s = Math.floor((Date.now()-date.getTime())/1000);
  if(s<60) return 'agora mesmo';
  const m = Math.floor(s/60); if(m<60) return `há ${m} min`;
  const h = Math.floor(m/60); if(h<24) return `há ${h}h`;
  return `há ${Math.floor(h/24)}d`;
}

function titleCasePt(s){
  let t = s.toLowerCase().replace(/(^|[\s-])([a-zà-ÿ])/g,(m,sep,ch)=>sep+ch.toUpperCase());
  t = t.replace(/\b(De|Da|Do|Das|Dos|E)\b/g, w=>w.toLowerCase());
  return t;
}

const ORDINAL_LABEL = {1:'1ª CIA',2:'2ª CIA',3:'3ª CIA',4:'4ª CIA','x':'Não informada'};

const params = new URLSearchParams(location.search);
const bpmParam = (params.get('bpm')||'').trim();
const isAdmin = params.get('admin')==='1';
const validBpms = Object.keys(DATA.bpmLabels);

if(isAdmin){
  renderApp(validBpms.slice());
}else if(validBpms.includes(bpmParam)){
  renderApp([bpmParam]);
}else{
  renderChooser();
}

function renderChooser(){
  const cards = validBpms.map(bpm=>{
    const escolas = DATA.escolas.filter(e=>e.bpm===bpm);
    const bairros = new Set(DATA.bairros.filter(b=>b.bpm===bpm).map(b=>b.key));
    return `<a class="bpm-card" href="?bpm=${bpm}">
      <div class="num">${bpm}º</div>
      <div class="name">${esc(DATA.bpmLabels[bpm])}</div>
      <div class="meta"><span>${escolas.length} locais</span><span>${bairros.size} bairros</span></div>
    </a>`;
  }).join('');
  document.getElementById('root').innerHTML = `
    <div class="chooser">
      <div class="eyebrow">Operação Eleições 2026 · CPC I</div>
      <h1>Selecione um Batalhão</h1>
      <p>Cada card abaixo abre o mapa de locais de votação travado na área do respectivo batalhão — é o link que deve ser repassado ao responsável daquela área. Dentro do mapa é possível filtrar por Companhia e por Bairro.</p>
      <div class="bpm-grid">${cards}</div>
      <div class="src">Fonte: O.S. 324 — Operação Eleições 2026. Coordenadas dos bairros: KML "CPC I". Locais de votação e lat/long: planilha de locais por batalhão, CIA e bairro.</div>
    </div>`;
}

function renderApp(bpmList){
  const multi = bpmList.length > 1;
  const bairros = DATA.bairros.filter(b=>bpmList.includes(b.bpm));
  const escolas = DATA.escolas.filter(e=>bpmList.includes(e.bpm));
  const located = escolas.filter(e=>e.lat!=null && e.lon!=null);
  const missing = escolas.filter(e=>e.lat==null || e.lon==null);

  const bairroToCia = {};
  escolas.forEach(e=>{ bairroToCia[e.bairroKey] = e.cia; });

  // color is always by ordinal position of the company within its own battalion
  // (1st company of any battalion = blue, 2nd = orange, ...) so the legend stays
  // small even when several battalions are shown together.
  function ciaColorFor(cia){ return ORDINAL_COLOR[ciaOrdinal(cia)]; }

  const ordinalsPresent = [...new Set(escolas.map(e=>ciaOrdinal(e.cia)))]
    .sort((a,b)=> (a==='x'?99:a) - (b==='x'?99:b));

  // ---- sidebar markup ----
  const totalEleitores = escolas.reduce((a,e)=>a + (e.eleitoresNum||0), 0);
  const polyKeys = new Set(bairros.map(b=>b.key));
  const extraBairros = [...new Set(escolas.filter(e=>!polyKeys.has(e.bairroKey)).map(e=>e.bairroKey))]
    .map(key=>({key, bairro: escolas.find(e=>e.bairroKey===key).bairro, bpm: escolas.find(e=>e.bairroKey===key).bpm}));
  const bairroList = [...bairros, ...extraBairros].sort((a,b)=>{
    if(multi && a.bpm!==b.bpm) return parseInt(a.bpm)-parseInt(b.bpm);
    return a.bairro.localeCompare(b.bairro);
  });
  const bairroCountTotal = new Set(escolas.map(e=>e.bairroKey)).size;

  const ciaCompositeKeys = [...new Set(escolas.map(e=>e.bpm+'|'+e.cia))].sort((ka,kb)=>{
    const [bpmA,ciaA] = ka.split('|'), [bpmB,ciaB] = kb.split('|');
    if(bpmA!==bpmB) return parseInt(bpmA)-parseInt(bpmB);
    return ciaOrdinal(ciaA)===ciaOrdinal(ciaB) ? 0 : (ciaOrdinal(ciaA)==='x'?1:(ciaOrdinal(ciaB)==='x'?-1:ciaOrdinal(ciaA)-ciaOrdinal(ciaB)));
  });

  const ciaRows = ciaCompositeKeys.map(key=>{
    const [bpm, cia] = key.split('|');
    const count = escolas.filter(e=>(e.bpm+'|'+e.cia)===key).length;
    const color = ciaColorFor(cia);
    const ciaLabel = cia==='CIA não informada' ? 'Não informada' : cia;
    const label = multi ? `${bpm}º BPM · ${ciaLabel}` : ciaLabel;
    return `<label class="check-row" data-bpm="${esc(bpm)}"><input type="checkbox" class="cia-check" data-ciakey="${esc(key)}" data-bpm="${esc(bpm)}" checked>
      <span class="swatch" style="background:${color}"></span>
      <span class="name">${esc(label)}</span><span class="count tabular">${count}</span></label>`;
  }).join('');

  const bpmRows = multi ? bpmList.map(bpm=>{
    const count = escolas.filter(e=>e.bpm===bpm).length;
    return `<label class="check-row"><input type="checkbox" class="bpm-check" data-bpm="${esc(bpm)}" checked>
      <span class="name">${esc(DATA.bpmLabels[bpm])}</span><span class="count tabular">${count}</span></label>`;
  }).join('') : '';

  const bairroRows = bairroList.map(b=>{
    const count = escolas.filter(e=>e.bairroKey===b.key).length;
    const label = multi ? `${b.bpm}º BPM — ${titleCasePt(b.bairro)}` : titleCasePt(b.bairro);
    const cia = bairroToCia[b.key];
    const ciakey = cia ? b.bpm+'|'+cia : '';
    return `<label class="check-row" data-bpm="${esc(b.bpm)}" data-ciakey="${esc(ciakey)}"><input type="checkbox" class="bairro-check" data-key="${esc(b.key)}" checked>
      <span class="name">${esc(label)}</span><span class="count tabular">${count}</span></label>`;
  }).join('');

  const resourceCatsPresent = Object.keys(DATA.resourceLabels).filter(k=>
    escolas.some(e=>e.turno1Cat===k || e.turno2Cat===k));
  const hasNoResource = escolas.some(e=>!e.turno1Cat || !e.turno2Cat);
  const resourceRows = resourceCatsPresent.map(k=>{
    const count = escolas.filter(e=>e.turno1Cat===k || e.turno2Cat===k).length;
    return `<label class="check-row"><input type="checkbox" class="recurso-check" data-recurso="${esc(k)}" checked>
      <img class="lthumb" src="icons/${k}.png" alt="">
      <span class="name">${esc(DATA.resourceLabels[k])}</span><span class="count tabular">${count}</span></label>`;
  }).join('') + (hasNoResource ? `<label class="check-row"><input type="checkbox" class="recurso-check" data-recurso="__none__" checked>
      <span class="swatch" style="background:var(--cia-x)"></span>
      <span class="name">Sem recurso definido</span><span class="count tabular">${escolas.filter(e=>!e.turno1Cat||!e.turno2Cat).length}</span></label>` : '');

  const missingBox = missing.length ? `<div class="filter-group"><div class="missing-box">
    <div class="mh">⚠ ${missing.length} local(is) sem coordenada</div>
    ${missing.map(e=>`<div class="missing-row"><b>${esc(e.local)}</b><br>${multi?esc(DATA.bpmLabels[e.bpm])+' · ':''}${esc(titleCasePt(e.bairro))} · ${esc(e.cia)} · ${fmtInt(e.eleitoresNum)} eleitores</div>`).join('')}
  </div></div>` : '';

  const bpmFilterGroup = multi ? `<div class="filter-group">
          <h3>Batalhão <button id="resetBpm" type="button">todos</button></h3>
          <div class="checklist">${bpmRows}</div>
        </div>` : '';

  const headerTitle = multi ? 'Gerência Geral' : `${bpmList[0]}º BPM`;
  const headerSub = multi ? 'Todos os batalhões — CPC I' : DATA.bpmLabels[bpmList[0]];
  const footnoteText = multi
    ? `Fonte: O.S. 324 — Operação Eleições 2026. Link de gerência geral — vê e filtra todos os batalhões do CPC I.`
    : `Fonte: O.S. 324 — Operação Eleições 2026. Link de acesso exclusivo ao ${bpmList[0]}º BPM.`;

  document.getElementById('root').innerHTML = `
    <div class="app">
      <div class="backdrop" id="backdrop"></div>
      <aside class="sidebar" id="sidebar">
        <div class="hdr">
          <div class="eyebrow">Operação Eleições 2026 · CPC I</div>
          <h1>${esc(headerTitle)}</h1>
          <p>${esc(headerSub)}</p>
        </div>
        <div class="stats">
          <div class="stat"><span class="v tabular">${escolas.length}</span><span class="l">Locais</span></div>
          <div class="stat"><span class="v tabular">${bairroCountTotal}</span><span class="l">Bairros</span></div>
          <div class="stat"><span class="v tabular">${fmtInt(totalEleitores)}</span><span class="l">Eleitores</span></div>
        </div>
        ${bpmFilterGroup}
        <div class="filter-group">
          <h3>Companhia <button id="resetCia" type="button">todas</button></h3>
          <div class="checklist">${ciaRows}</div>
        </div>
        <div class="filter-group">
          <h3>Recurso (turno atual) <button id="resetRecurso" type="button">todos</button></h3>
          <div class="checklist">${resourceRows}</div>
        </div>
        <div class="filter-group">
          <h3>Bairro <button id="resetBairro" type="button">todos</button></h3>
          <input type="text" class="search-input" id="searchLocal" placeholder="Buscar local ou endereço…">
          <div class="checklist">${bairroRows}</div>
        </div>
        ${missingBox}
        <div class="footnote">${footnoteText}</div>
      </aside>
      <main class="mapwrap" id="mapwrap">
        <div id="map"></div>
        <div class="filtoggle" id="filtoggle">☰ Filtros</div>
        <div class="topbadge"><span class="dot"></span><span id="visibleCount">${located.length}</span>&nbsp;de&nbsp;${located.length} locais visíveis</div>
        <div class="turno-toggle">
          <button type="button" class="active" id="turno1Btn">1º turno</button>
          <button type="button" id="turno2Btn">2º turno</button>
        </div>
        <div class="legend" id="legend">
          <div class="lhead" id="legendToggle">Legenda <span class="chev">▾</span></div>
          <div class="lbody">
            ${ordinalsPresent.map(ord=>`<div class="lrow"><span class="swatch" style="background:${ORDINAL_COLOR[ord]}"></span>${esc(ORDINAL_LABEL[ord])}<span class="count tabular">${escolas.filter(e=>ciaOrdinal(e.cia)===ord).length}</span></div>`).join('')}
            <div class="lsec">
              ${Object.keys(DATA.resourceLabels).filter(k=>k!=='outro').map(k=>`<div class="lrow"><img class="lthumb" src="icons/${k}.png" alt="">${esc(DATA.resourceLabels[k])}</div>`).join('')}
            </div>
            <div class="lnote">Cor = ordem da Companhia no batalhão (1ª, 2ª...). Ícone = recurso destacado no turno selecionado. Contorno <b style="color:#0ca30c">verde</b> = Pronto, <b style="color:var(--critical)">vermelho</b> = Falta.</div>
          </div>
        </div>
        <div class="zoomctl">
          <button class="zoombtn" id="zoomIn" type="button" aria-label="Aproximar">+</button>
          <button class="zoombtn" id="zoomOut" type="button" aria-label="Afastar">–</button>
          <button class="zoombtn" id="zoomReset" type="button" aria-label="Redefinir zoom">⤾</button>
        </div>
      </main>
      <div class="detail" id="detail">
        <button class="close" id="detailClose" aria-label="Fechar">×</button>
        <div id="detailBody"></div>
      </div>
    </div>`;

  try{
    wireApp({multi, bairros, escolas, located, missing, bairroToCia, ciaColorFor});
  }catch(err){
    const mapEl = document.getElementById('map');
    if(mapEl) mapEl.innerHTML = `<div style="padding:24px;color:var(--ink);font-size:13px;">Não foi possível carregar o mapa (${esc(err.message||String(err))}). Tente recarregar a página ou abrir em outro navegador.</div>`;
    console.error(err);
  }
}

function wireApp({bairros, escolas, located, bairroToCia, ciaColorFor}){
  const detail = document.getElementById('detail');
  const detailBody = document.getElementById('detailBody');
  const visibleCountEl = document.getElementById('visibleCount');

  const map = L.map('map', {zoomControl:false, attributionControl:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const bairroEntries = bairros.map(b=>{
    const cia = bairroToCia[b.key];
    const color = cia ? ciaColorFor(cia) : 'var(--cia-x)';
    const layer = L.polygon(b.coords, {color, weight:1.6, fillColor:color, fillOpacity:0.20}).addTo(map);
    layer.on('click', ()=> map.fitBounds(layer.getBounds(), {padding:[24,24]}));
    return {layer, key:b.key, bpm:b.bpm, cia};
  });

  let turno = '1';

  function iconHtml(cat, color){
    if(cat){
      return `<div class="ricon"><img src="icons/${cat}.png" alt=""></div>`;
    }
    return `<div class="ricon plain"><span class="dotfill" style="background:${color}"></span></div>`;
  }
  function makeIcon(e, color){
    const cat = turno==='1' ? e.turno1Cat : e.turno2Cat;
    return L.divIcon({ className:'', html:iconHtml(cat, color), iconSize:[36,36], iconAnchor:[18,18] });
  }

  const markerEntries = located.map(e=>{
    const color = ciaColorFor(e.cia);
    const layer = L.marker([e.lat, e.lon], { icon: makeIcon(e, color) }).addTo(map);
    layer.on('click', ()=> openDetail(e, e.cia, color));
    return {layer, e, color};
  });

  // ---- live "situação" ring on the marker itself (green=pronto, red=falta) ----
  let situacaoMap = {};
  function applySituacaoRing(entry){
    const el = entry.layer.getElement();
    const ricon = el && el.querySelector('.ricon');
    if(!ricon) return;
    const val = situacaoMap[situacaoDocId(entry.e)];
    ricon.classList.toggle('situacao-pronto', val==='pronto');
    ricon.classList.toggle('situacao-falta', val==='falta');
  }
  function refreshAllSituacaoRings(){ markerEntries.forEach(applySituacaoRing); }
  if(db){
    db.collection('status').onSnapshot(snap=>{
      situacaoMap = {};
      snap.forEach(doc=>{ situacaoMap[doc.id] = doc.data().situacao; });
      refreshAllSituacaoRings();
    }, err=>console.error('situação (live ring) indisponível:', err));
  }

  function setTurno(t){
    turno = t;
    document.getElementById('turno1Btn').classList.toggle('active', t==='1');
    document.getElementById('turno2Btn').classList.toggle('active', t==='2');
    markerEntries.forEach(({layer, e, color})=> layer.setIcon(makeIcon(e, color)));
    refreshAllSituacaoRings();
    update();
  }
  document.getElementById('turno1Btn').addEventListener('click', ()=>setTurno('1'));
  document.getElementById('turno2Btn').addEventListener('click', ()=>setTurno('2'));

  const boundsPoints = [];
  bairros.forEach(b=>b.coords.forEach(c=>boundsPoints.push(c)));
  located.forEach(e=>boundsPoints.push([e.lat, e.lon]));
  const initialBounds = boundsPoints.length ? L.latLngBounds(boundsPoints) : L.latLngBounds([[-1.46,-48.49],[-1.40,-48.44]]);
  map.fitBounds(initialBounds, {padding:[24,24]});

  document.getElementById('zoomIn').addEventListener('click', ()=>map.zoomIn());
  document.getElementById('zoomOut').addEventListener('click', ()=>map.zoomOut());
  document.getElementById('zoomReset').addEventListener('click', ()=>map.fitBounds(initialBounds,{padding:[24,24]}));

  let situacaoUnsub = null;
  function openDetail(e, cia, color){
    const statusOk = e.status === 'Localizado';
    detailBody.innerHTML = `
      <div class="eyebrow2">Nº ${esc(e.numero)} · ${esc(titleCasePt(e.bairro))}</div>
      <h2>${esc(e.local)}</h2>
      <span class="ciachip"><span class="swatch" style="background:${color}"></span>${esc(cia==='CIA não informada'?'Companhia não informada':cia)}</span>
      <dl>
        <dt>Batalhão</dt><dd>${esc(DATA.bpmLabels[e.bpm])}</dd>
        <dt>Endereço</dt><dd>${esc(e.endereco)||'—'}</dd>
        <dt>Eleitores</dt><dd class="tabular">${fmtInt(e.eleitoresNum)}</dd>
        <dt>1º turno</dt><dd>${esc(e.turno1)||'—'}</dd>
        <dt>2º turno</dt><dd>${esc(e.turno2)||'—'}</dd>
        <dt>Coordenadas</dt><dd class="mono">${e.lat!=null?e.lat.toFixed(6)+', '+e.lon.toFixed(6):'não localizado'}</dd>
        <dt>Status</dt><dd><span class="statusbadge ${statusOk?'ok':'warn'}">${statusOk?'✓':'⚠'} ${esc(e.status)}</span></dd>
      </dl>
      <div class="situacao-section">
        <div class="situacao-label">Situação (compartilhada entre todos)</div>
        <div class="situacao-group">
          <button type="button" class="situacao-btn falta" data-val="falta">Falta</button>
          <button type="button" class="situacao-btn pronto" data-val="pronto">Pronto</button>
        </div>
        <div class="situacao-meta" id="situacaoMeta">Carregando…</div>
        <div class="situacao-label" style="margin-top:14px;">Guarnição (GU)</div>
        <textarea id="guarnicaoInput" class="guarnicao-input" rows="2" placeholder="Nomes dos policiais na guarnição…"></textarea>
        <button type="button" class="situacao-save" id="guarnicaoSave">Salvar guarnição</button>
        <div class="situacao-meta" id="guarnicaoMeta"></div>
      </div>`;
    detail.classList.add('open');

    if(situacaoUnsub){ situacaoUnsub(); situacaoUnsub=null; }
    const btns = [...detailBody.querySelectorAll('.situacao-btn')];
    const metaEl = document.getElementById('situacaoMeta');
    const guarnicaoInput = document.getElementById('guarnicaoInput');
    const guarnicaoMeta = document.getElementById('guarnicaoMeta');
    const guarnicaoSaveBtn = document.getElementById('guarnicaoSave');
    if(!db){
      metaEl.textContent = 'Situação indisponível no momento.';
      btns.forEach(b=>b.disabled = true);
      guarnicaoInput.disabled = true;
      guarnicaoSaveBtn.disabled = true;
      return;
    }
    const docRef = db.collection('status').doc(situacaoDocId(e));
    let currentSituacao = null;
    btns.forEach(b=>b.addEventListener('click', ()=>{
      const next = currentSituacao===b.dataset.val ? firebase.firestore.FieldValue.delete() : b.dataset.val;
      metaEl.textContent = 'Salvando…';
      docRef.set({ situacao: next, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true})
        .catch(err=>{ metaEl.textContent = 'Não foi possível salvar. Tente de novo.'; console.error(err); });
    }));
    guarnicaoSaveBtn.addEventListener('click', ()=>{
      guarnicaoMeta.textContent = 'Salvando…';
      docRef.set({ guarnicao: guarnicaoInput.value.slice(0,500), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true})
        .then(()=>{ guarnicaoMeta.textContent = 'Guarnição salva.'; })
        .catch(err=>{ guarnicaoMeta.textContent = 'Não foi possível salvar. Tente de novo.'; console.error(err); });
    });
    situacaoUnsub = docRef.onSnapshot(snap=>{
      const data = snap.data();
      currentSituacao = data ? data.situacao : null;
      btns.forEach(b=>b.classList.toggle('active', b.dataset.val===currentSituacao));
      metaEl.textContent = data && data.updatedAt
        ? 'Atualizado ' + timeAgo(data.updatedAt.toDate())
        : 'Ainda não marcado';
      if(document.activeElement !== guarnicaoInput){
        guarnicaoInput.value = (data && data.guarnicao) || '';
      }
    }, err=>{
      metaEl.textContent = 'Situação indisponível no momento.';
      console.error(err);
    });
  }
  document.getElementById('detailClose').addEventListener('click', ()=>{
    detail.classList.remove('open');
    if(situacaoUnsub){ situacaoUnsub(); situacaoUnsub=null; }
  });

  // ---- filters ----
  const ciaChecks = [...document.querySelectorAll('.cia-check')];
  const bairroChecks = [...document.querySelectorAll('.bairro-check')];
  const recursoChecks = [...document.querySelectorAll('.recurso-check')];
  const bpmChecks = [...document.querySelectorAll('.bpm-check')];
  const searchInput = document.getElementById('searchLocal');

  function currentFilters(){
    const ciaOn = {}; ciaChecks.forEach(c=>ciaOn[c.dataset.ciakey]=c.checked);
    const bairroOn = {}; bairroChecks.forEach(c=>bairroOn[c.dataset.key]=c.checked);
    const recursoOn = {}; recursoChecks.forEach(c=>recursoOn[c.dataset.recurso]=c.checked);
    const bpmOn = {}; bpmChecks.forEach(c=>bpmOn[c.dataset.bpm]=c.checked);
    const q = norm(searchInput.value||'');
    return {ciaOn, bairroOn, recursoOn, bpmOn, q};
  }

  function update(){
    const {ciaOn, bairroOn, recursoOn, bpmOn, q} = currentFilters();
    let visible = 0;
    markerEntries.forEach(({layer, e})=>{
      const cat = (turno==='1' ? e.turno1Cat : e.turno2Cat) || '__none__';
      const on = (ciaOn[e.bpm+'|'+e.cia]!==false) && (bairroOn[e.bairroKey]!==false) && (recursoOn[cat]!==false) &&
        (bpmOn[e.bpm]!==false) && (!q || norm(e.local).includes(q) || norm(e.endereco).includes(q));
      if(on){ if(!map.hasLayer(layer)) layer.addTo(map); visible++; }
      else if(map.hasLayer(layer)) map.removeLayer(layer);
    });
    bairroEntries.forEach(({layer, key, bpm, cia})=>{
      const bVisible = bairroOn[key] !== false;
      const cVisible = !cia || ciaOn[bpm+'|'+cia] !== false;
      const pVisible = bpmOn[bpm] !== false;
      const on = bVisible && cVisible && pVisible;
      layer.setStyle({opacity:on?1:0.10, fillOpacity:on?0.20:0.02});
    });
    visibleCountEl.textContent = visible;
  }

  // ---- cascading filters: checking a Batalhão narrows the Companhia list to its
  // own companies; checking a Companhia narrows the Bairro list to its own bairros ----
  function refreshVisibility(){
    const bpmOn = {}; bpmChecks.forEach(c=>bpmOn[c.dataset.bpm]=c.checked);
    const ciaOn = {}; ciaChecks.forEach(c=>ciaOn[c.dataset.ciakey]=c.checked);
    ciaChecks.forEach(c=>{
      const row = c.closest('.check-row');
      const visible = bpmChecks.length===0 || bpmOn[row.dataset.bpm]!==false;
      row.classList.toggle('filtered-out', !visible);
    });
    bairroChecks.forEach(c=>{
      const row = c.closest('.check-row');
      const bpmVisible = bpmChecks.length===0 || bpmOn[row.dataset.bpm]!==false;
      const ciakey = row.dataset.ciakey;
      const ciaVisible = !ciakey || ciaOn[ciakey]!==false;
      row.classList.toggle('filtered-out', !(bpmVisible && ciaVisible));
    });
  }

  ciaChecks.forEach(c=>c.addEventListener('change', ()=>{ update(); refreshVisibility(); }));
  bairroChecks.forEach(c=>c.addEventListener('change', update));
  recursoChecks.forEach(c=>c.addEventListener('change', update));
  bpmChecks.forEach(c=>c.addEventListener('change', ()=>{ update(); refreshVisibility(); }));
  searchInput.addEventListener('input', update);
  document.getElementById('resetCia').addEventListener('click', ()=>{ciaChecks.forEach(c=>c.checked=true); update(); refreshVisibility();});
  document.getElementById('resetBairro').addEventListener('click', ()=>{bairroChecks.forEach(c=>c.checked=true); update();});
  document.getElementById('resetRecurso').addEventListener('click', ()=>{recursoChecks.forEach(c=>c.checked=true); update();});
  const resetBpmBtn = document.getElementById('resetBpm');
  if(resetBpmBtn) resetBpmBtn.addEventListener('click', ()=>{bpmChecks.forEach(c=>c.checked=true); update(); refreshVisibility();});
  refreshVisibility();

  // ---- mobile sidebar toggle ----
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('backdrop');
  const filtoggle = document.getElementById('filtoggle');
  filtoggle.addEventListener('click', ()=>{ sidebar.classList.add('open'); backdrop.classList.add('show'); map.invalidateSize(); });
  backdrop.addEventListener('click', ()=>{ sidebar.classList.remove('open'); backdrop.classList.remove('show'); });

  // ---- collapsible legend (starts collapsed on small screens) ----
  const legend = document.getElementById('legend');
  const legendToggle = document.getElementById('legendToggle');
  if(window.innerWidth <= 760) legend.classList.add('collapsed');
  legendToggle.addEventListener('click', ()=> legend.classList.toggle('collapsed'));

  window.addEventListener('resize', ()=>map.invalidateSize());
  setTimeout(()=>map.invalidateSize(), 200);
}
</script>
</body>
</html>
